apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "expo.modules.viatom"
    compileSdkVersion 35
    ndkVersion "27.1.12297006"

    packaging {
        jniLibs {
            pickFirsts += [
                    '**/libc++_shared.so',
                    '**/libreactnative.so'
            ]
        }
    }

    defaultConfig {
        minSdkVersion 24

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    // This block must be a direct child of android { }, not inside defaultConfig
    externalNativeBuild {
        cmake {
            path "../src/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // Expo Module Core
    implementation project(':expo-modules-core')
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    // LiveEventBus + lifecycle
    implementation project(':liveeventbus-x')
    implementation "androidx.lifecycle:lifecycle-livedata-core-ktx:2.8.6"

    // Logging dependencies required by Lepu SDK
    implementation "io.getstream:stream-log-android:1.1.4"
    implementation "io.getstream:stream-log-android-file:1.1.4"

    // Nordic BLE observer interface
    implementation "no.nordicsemi.android:ble:2.7.2"

    // Local Lepu BLE AAR
    implementation files("libs/lepu-blepro-1.3.9.aar")
}